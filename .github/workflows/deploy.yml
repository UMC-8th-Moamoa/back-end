name: Deploy to Production

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        command_timeout: 30m
        script: |
          cd /home/ec2-user/back-end
          git pull origin dev
          npm ci --only=production
          
          # PM2 무중단 배포
          pm2 reload moamoa-api --update-env
          
          
          pm2 start ecosystem.config.cjs --env production

          echo "Warming up app..."
          

          
          # 헬스체크
          sleep 20
          if curl -f http://15.165.121.220:3000/health; then
            echo "Deployment successful"
            pm2 save
          else
            echo "Deployment failed, rolling back"
            pm2 reload moamoa-api
            exit 0
          fi
